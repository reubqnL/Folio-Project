name: Folio
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: 6
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
packages:
  FolioCore:
    path: .
targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Folio.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Folio
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Folio development build
        NSMicrophoneUsageDescription: "Folio uses the microphone only after you press Record to create an on-device transcript for your review. Folio does not save an audio recording or start AI generation automatically."
    entitlements:
      path: App/Folio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.folio.development
        PRODUCT_NAME: Folio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: FolioCore
        product: FolioCore
schemes:
  Folio:
    build:
      targets:
        Folio: all
    run:
      config: Debug
    archive:
      config: Release
